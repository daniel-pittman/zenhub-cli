# Continuous integration: bash + Python syntax checks.
#
# This workflow needs NO secrets and is safe to run on every push and PR,
# including PRs from forks. The secret-sensitive Claude review workflows are
# separate files, each gated by their own posture.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

# Cancel superseded runs on the same PR / ref. Without this, rapid PR
# iteration queues parallel runs against stale SHAs, which on the metered /
# subscription-bound review workflows below would burn credits unnecessarily.
# CI itself is free, but we set the same posture across all workflows for
# consistency and to keep the Actions tab readable.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned actions/checkout v4.2.2
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Bash syntax check (zh)
        run: bash -n zh

      # SHA-pinned actions/setup-python v5.3.0
      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"

      - name: Python syntax check (MCP server + similarity engine)
        run: python -m py_compile mcp_server.py similarity.py
