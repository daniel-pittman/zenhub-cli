# Continuous integration: bash + Python syntax checks.
#
# This workflow needs NO secrets and is safe to run on every push and PR,
# including PRs from forks. The secret-sensitive Claude review workflows are
# separate files, each gated by their own posture.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    strategy:
      # Enforce the Python compatibility floor advertised in README's badge
      # (3.10+). 3.10 is the floor because the code uses PEP 604 union syntax
      # (`X | None`) and PEP 585 builtin generics (`list[str]`) as runtime
      # annotations; both are 3.10 features. 3.12 catches removed-feature
      # regressions. fail-fast: false so a problem in one version doesn't
      # mask problems in others.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      # SHA-pinned actions/checkout v7.0.1
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Bash syntax check (zh)
        run: bash -n zh

      # SHA-pinned actions/setup-python v7.0.0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Python syntax check (MCP server, GraphQL client + similarity)
        run: python -m py_compile mcp_server.py zh_api.py zh_graphql_ops.py similarity.py

      # Install the test deps from requirements-dev.txt (pytest + numpy),
      # the single declared source shared with the local-venv instructions
      # in CONTRIBUTING.md. The tests mock the network and the embedding
      # model entirely, so they do NOT need mcp / sentence-transformers /
      # torch (the ~1GB of heavy wheels) — those are exercised at MCP
      # runtime, not here. numpy IS needed: the similarity-scoring tests
      # construct fake normalized embedding vectors to exercise
      # find_similar's threshold + min_results math; ~15MB, negligible.
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run pytest
        run: python -m pytest tests/ -v
