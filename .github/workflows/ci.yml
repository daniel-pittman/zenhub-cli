# Continuous integration: bash + Python syntax checks.
#
# This workflow needs NO secrets and is safe to run on every push and PR,
# including PRs from forks. The secret-sensitive Claude review workflows are
# separate files, each gated by their own posture.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    strategy:
      # Enforce the Python compatibility floor advertised in README's badge
      # (3.10+). 3.10 is the floor because the code uses PEP 604 union syntax
      # (`X | None`) and PEP 585 builtin generics (`list[str]`) as runtime
      # annotations; both are 3.10 features. 3.12 catches removed-feature
      # regressions. fail-fast: false so a problem in one version doesn't
      # mask problems in others.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      # SHA-pinned actions/checkout v4.2.2
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Bash syntax check (zh)
        run: bash -n zh

      # SHA-pinned actions/setup-python v5.3.0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Python syntax check (MCP server, GraphQL client + similarity)
        run: python -m py_compile mcp_server.py zh_api.py zh_graphql_ops.py similarity.py

      # Install pytest + numpy. The tests mock the network and the
      # embedding model entirely, so they do NOT need mcp /
      # sentence-transformers / torch (the ~1GB of heavy wheels) — those
      # are exercised at MCP runtime, not here. numpy IS needed: the
      # similarity-scoring tests construct fake normalized embedding
      # vectors to exercise find_similar's threshold + min_results math.
      # numpy is ~15MB, so it doesn't meaningfully slow the matrix.
      - name: Install test deps
        run: python -m pip install --upgrade pip pytest numpy

      - name: Run pytest
        run: python -m pytest tests/ -v
