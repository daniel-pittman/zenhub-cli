# Claude-driven security review on every PR targeting `main` or `develop`.
#
# This workflow uses the metered ANTHROPIC_API_KEY (not the OAuth token)
# because anthropics/claude-code-security-review does not currently support
# OAuth bindings. Cost-control posture:
#
#   * Trigger is scoped to PRs whose BASE branch is `main` or `develop`.
#     Day-to-day feature-branch PRs (feature -> feature, draft -> draft) do
#     not pay the API cost. A `workflow_dispatch` trigger is also wired so a
#     maintainer can manually re-run the review on demand.
#
#   * "Require approval for all outside collaborators" is enabled in the
#     repository's Actions settings. A first-time outside contributor's first
#     workflow run must be approved by a maintainer before any Action
#     executes, which bounds drive-by API-credit burn from random PRs.
#
#   * Permissions are minimal: `contents: read` + `pull-requests: write`.
#
#   * The model is pinned to a specific Sonnet version so cost and behaviour
#     are predictable across runs.
#
#   * The action is SHA-pinned. Bump by re-resolving:
#       gh api repos/anthropics/claude-code-security-review/git/refs/heads/main
#
# The ANTHROPIC_API_KEY repository secret must be provisioned by a maintainer
# (see SECURITY.md).

name: Claude Security Review

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

# Cancel superseded runs on the same PR. This one matters most for cost:
# the security-review workflow uses the metered ANTHROPIC_API_KEY (not the
# OAuth token), so each run bills against the API account. Push-after-push
# iteration without this block burns credits on stale SHAs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  security-review:
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned actions/checkout v4.2.2
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      # SHA-pinned anthropics/claude-code-security-review (no tags exist; the
      # action documents `@main` use, but we pin to the main-branch HEAD as of
      # 2026-02-11 to keep behaviour stable). Bump per the header comment.
      - name: Run Claude security review
        uses: anthropics/claude-code-security-review@0c6a49f1fa56a1d472575da86a94dbc1edb78eda
        with:
          claude-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          comment-pr: true
          upload-results: true
          claude-model: claude-sonnet-4-5-20250929
          claudecode-timeout: 20
          exclude-directories: .venv,build,dist,__pycache__,.git
